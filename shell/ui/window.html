<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DigUp</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="window.css">
  <link rel="stylesheet" href="applications.css">
  <link rel="stylesheet" href="activity.css">
  <link rel="stylesheet" href="appearance.css">
  <link rel="stylesheet" href="pipeline.css">
  <link rel="stylesheet" href="desktop.css">
  <link rel="stylesheet" href="search-help.css">
  <script src="appearance.js"></script>
</head>
<body>
  <header class="top">
    <h1 class="visually-hidden">DigUp search</h1>
    <div class="bar">
      <div class="field" id="field" role="search" aria-label="Full search">
        <span class="glass" id="glass" aria-hidden="true"></span>
        <input id="query" type="text" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Search files, apps and settings" placeholder="Search files, apps and settings"
               role="combobox" aria-autocomplete="list" aria-haspopup="grid" aria-expanded="false" aria-controls="search-results" aria-describedby="search-keys">
        <button class="clear" id="clear" title="Clear" aria-label="Clear" hidden>
          <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8"/><path d="M7 7 L13 13 M13 7 L7 13"/></svg>
        </button>
        <span id="search-keys" class="visually-hidden">Use the arrow keys to select a result and Enter to open it. Press F1 for search help.</span>
      </div>
      <button class="tool details-tool" id="toggle-preview" aria-label="Result details" aria-pressed="true">Details</button>
      <button class="tool" id="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M18.7 10.0 L21.3 10.5 L21.3 13.5 L18.7 14.0 L18.2 15.3 L19.6 17.5 L17.5 19.6 L15.3 18.2 L14.0 18.7 L13.5 21.3 L10.5 21.3 L10.0 18.7 L8.7 18.2 L6.5 19.6 L4.4 17.5 L5.8 15.3 L5.3 14.0 L2.7 13.5 L2.7 10.5 L5.3 10.0 L5.8 8.7 L4.4 6.5 L6.5 4.4 L8.7 5.8 L10.0 5.3 L10.5 2.7 L13.5 2.7 L14.0 5.3 L15.3 5.8 L17.5 4.4 L19.6 6.5 L18.2 8.7 Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button class="tool help-tool" id="search-help-button" type="button" aria-haspopup="dialog" aria-keyshortcuts="F1">Help</button>
      <button class="tool" id="more" title="More" aria-label="More" aria-haspopup="menu" aria-controls="menu" aria-expanded="false">
        <svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg>
      </button>
    </div>
    <nav class="kinds" id="kinds" aria-label="Search categories">
      <div class="search-scopes" id="search-scopes"></div>
      <button class="chip file-types" id="file-types" type="button" aria-haspopup="menu" aria-controls="menu" aria-expanded="false">
        <span id="file-types-label">File types</span><span class="number" id="file-types-count" hidden></span>
      </button>
    </nav>
    <div class="menu" id="menu" role="menu" hidden></div>
  </header>

  <main class="split">
    <div class="content" id="content">
      <div id="search-results" class="visually-hidden" role="grid" aria-label="Search results" hidden></div>
      <div id="search-sections"></div>
      <div id="search-feedback"></div>
    </div>
    <aside class="side" id="side"></aside>
  </main>

  <footer class="status">
    <button class="status-line" id="status-line" title="Open Activity and diagnostics" aria-describedby="index-summary">Activity</button>
    <span class="index-summary" id="index-summary"></span>
    <span class="spacer"></span>
    <span class="count" id="count"></span>
    <button class="update" id="update" title="See what's new and update" hidden></button>
  </footer>

  <span id="results-status" class="visually-hidden" role="status" aria-atomic="true"></span>
  <dialog class="big" id="big-preview" aria-labelledby="big-preview-title"></dialog>
  <script src="results.js"></script>
  <script src="applications.js"></script>
  <script src="launcher.js"></script>
  <script src="windows-settings.js"></script>
  <script src="mixed-results.js"></script>
  <script src="pipeline.js"></script>
  <script src="activity.js"></script>
  <script src="search-help.js"></script>
  <script src="window.js"></script>
</body>
</html>
