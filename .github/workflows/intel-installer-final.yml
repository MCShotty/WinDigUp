name: Final Intel installer acceptance
on:
  push:
    branches: [codex/intel-installer-final]
permissions:
  contents: read
  actions: read
jobs:
  installed:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prove installed-check sources match the PR
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin 54e5a9a3209e6aaea6e087af3fa8f4a358352703
          if($LASTEXITCODE){throw 'Missing source provenance'}
          git diff --exit-code 54e5a9a3209e6aaea6e087af3fa8f4a358352703 HEAD -- . ':!.github/workflows/intel-installer-final.yml'
          if($LASTEXITCODE){throw 'Production sources differ from the PR'}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          vsversion: '2022'
          toolset: '14.44'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Wait for the final-head installer from the normal package build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers=@{Authorization=('Bearer '+$env:GH_TOKEN);Accept='application/vnd.github+json'}
          $deadline=[DateTime]::UtcNow.AddMinutes(40)
          do {
            $run=Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/MCShotty/WinDigUp/actions/runs/40602579558'
            if($run.head_sha -ne '54e5a9a3209e6aaea6e087af3fa8f4a358352703'){throw 'Unexpected package source'}
            $artifacts=Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/MCShotty/WinDigUp/actions/runs/40602579558/artifacts'
            $artifact=@($artifacts.artifacts|Where-Object {$_.name -eq 'DigUp-windows-x64-test-signed' -and !$_.expired})
            if($artifact.Count -eq 1){
              ('CANDIDATE_ARTIFACT='+$artifact[0].id)|Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              Write-Output ('Testing production installer artifact '+$artifact[0].id)
              exit 0
            }
            if($run.status -eq 'completed'){throw 'The production installer was not built successfully'}
            Write-Output 'Waiting for final-head Windows packaging.'
            Start-Sleep -Seconds 15
          }while([DateTime]::UtcNow -lt $deadline)
          throw 'The production package was not available before the deadline'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ env.CANDIDATE_ARTIFACT }}
          run-id: 40602579558
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/production-installer
      - name: Install the unchanged production artifact and verify Intel runtime
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'production-installer'
          $cert=@(Get-ChildItem $root -Recurse -Filter TEST-ONLY-WinDigUp.cer)
          $setup=@(Get-ChildItem $root -Recurse -Filter '*-setup.exe')
          if($cert.Count -ne 1 -or $setup.Count -ne 1){throw 'Unexpected production artifact layout'}
          scripts/check-windows-copilot.ps1 -PrepareTrust -CertificatePath $cert[0].FullName
          if($LASTEXITCODE){throw 'CI identity trust failed'}
          $process=Start-Process $setup[0].FullName -ArgumentList '/S' -PassThru -Wait
          if($process.ExitCode){throw 'Final installation failed'}
          $installed=Join-Path $env:LOCALAPPDATA 'DigUp'
          foreach($name in @('devices.py','npu_runtime.py','prepare_model.py','digup_openvino.py')){
            $expected=Get-FileHash (Join-Path $PWD ('worker/openvino/'+$name)) -Algorithm SHA256
            $actual=Get-FileHash (Join-Path $installed ('helper/openvino/'+$name)) -Algorithm SHA256
            if($expected.Hash -ne $actual.Hash){throw ('Installed Intel policy differs from PR: '+$name)}
          }
          $binary=[Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Join-Path $installed 'DigUp.exe')))
          if(!$binary.Contains('__TAURI_BUNDLE_TYPE_VAR_NSS') -or $binary.Contains('__TAURI_BUNDLE_TYPE_VAR_UNK')){throw 'NSIS updater marker missing'}
          scripts/check-windows-openvino.ps1
          if($LASTEXITCODE){throw 'Final installed Intel runtime failed'}
      - name: Compile the disposable launch and Control Panel fixture
        shell: pwsh
        run: |
          rc.exe /nologo "/fo$env:RUNNER_TEMP/app-launch-fixture.res" tests/windows/app-launch-fixture.rc
          if($LASTEXITCODE){throw 'Fixture resource compilation failed'}
          cl.exe /nologo /EHsc /std:c++17 /MT tests/windows/app-launch-fixture.cpp "$env:RUNNER_TEMP/app-launch-fixture.res" "/Fe:$env:RUNNER_TEMP/DigUp App Launch Fixture.exe" /link /SUBSYSTEM:WINDOWS shell32.lib user32.lib ole32.lib
          if($LASTEXITCODE){throw 'Fixture compilation failed'}
      - name: Installed application, Settings, Control Panel, panel and worker regressions
        shell: pwsh
        run: |
          scripts/check-windows-applications.ps1
          if($LASTEXITCODE){throw 'Application launching regressed'}
          scripts/check-windows-settings.ps1
          if($LASTEXITCODE){throw 'Windows Settings activation regressed'}
          scripts/check-windows-control-panel.ps1
          if($LASTEXITCODE){throw 'Control Panel activation regressed'}
          scripts/check-windows-panel.ps1
          if($LASTEXITCODE){throw 'Native panel rendering regressed'}
          scripts/check-windows-copilot.ps1
          if($LASTEXITCODE){throw 'Registered launcher activation regressed'}
          python scripts/check-app-protocol.py --helper "$env:LOCALAPPDATA\DigUp\helper\digup.exe"
          if($LASTEXITCODE){throw 'Application protocol regressed'}
          python scripts/check-windows-indexing.py --app "$env:LOCALAPPDATA\DigUp\DigUp.exe"
          if($LASTEXITCODE){throw 'Installed indexing protocol regressed'}
          python scripts/check-search-responsiveness.py --helper "$env:LOCALAPPDATA\DigUp\helper\digup.exe" --output "$env:RUNNER_TEMP\search-scheduling.json"
          if($LASTEXITCODE){throw 'Search concurrency regressed'}
          Write-Output 'PASS: production installer, private Intel runtime and installed launch/search regressions. Synthetic vectors do not establish physical GPU/NPU inference.'
      - name: Stage a flat download and exact installer hash
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'production-installer'
          $setup=@(Get-ChildItem $root -Recurse -Filter '*-setup.exe')
          $cert=@(Get-ChildItem $root -Recurse -Filter TEST-ONLY-WinDigUp.cer)
          New-Item -ItemType Directory -Force verified-installer|Out-Null
          Copy-Item $setup[0].FullName verified-installer/
          Copy-Item $cert[0].FullName verified-installer/
          Get-FileHash $setup[0].FullName -Algorithm SHA256|Format-List Algorithm,Hash,Path
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: DigUp-Intel-OpenVINO-windows-x64-verified-test
          path: verified-installer/*
          compression-level: 0
