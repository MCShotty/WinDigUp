name: Windows port
on:
  push:
    branches: [main]
    paths: ['windows/**', 'worker/windows/**', 'Sources/**', 'Tests/**', 'scripts/**', 'Package.swift', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'worker/windows/**', 'Sources/**', 'Tests/**', 'scripts/**', 'Package.swift', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  winui:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project windows/WinDigUp.Core.Tests -c Release
      - run: dotnet publish windows/WinDigUp/WinDigUp.csproj -c Release -p:Platform=x64 --self-contained true -o windows/artifacts/WinUI
      - uses: actions/upload-artifact@v4
        with:
          name: WinUI-build
          path: windows/artifacts/WinUI
  helper:
    name: helper (${{ matrix.backend }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, vulkan]
    env:
      VULKAN_SDK_VERSION: '1.4.363.0'
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          swift-version: swift-6.2.3-release
          swift-build: 6.2.3-RELEASE
      - name: Restore Vulkan SDK
        if: matrix.backend == 'vulkan'
        id: vulkan-sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/VulkanSDK-${{ env.VULKAN_SDK_VERSION }}
          key: windows-vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-installed
      - name: Install complete Vulkan SDK
        if: matrix.backend == 'vulkan' && steps.vulkan-sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $sdkRoot = Join-Path $env:RUNNER_TEMP "VulkanSDK-$env:VULKAN_SDK_VERSION"
          $installer = Join-Path $env:RUNNER_TEMP 'vulkan-sdk-installer.exe'
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkan_sdk.exe?Human=true" -OutFile $installer
          $installArgs = @('--root', "`"$sdkRoot`"", '--accept-licenses', '--default-answer', '--confirm-command', 'install')
          $setup = Start-Process -FilePath $installer -ArgumentList $installArgs -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Vulkan SDK installer failed: $($setup.ExitCode)" }
      - name: Verify Vulkan SDK development files
        if: matrix.backend == 'vulkan'
        shell: pwsh
        run: |
          $sdkRoot = Join-Path $env:RUNNER_TEMP "VulkanSDK-$env:VULKAN_SDK_VERSION"
          foreach ($file in @('Include/vulkan/vulkan.h', 'Lib/vulkan-1.lib', 'Bin/glslc.exe')) {
            if (-not (Test-Path (Join-Path $sdkRoot $file))) { throw "Vulkan SDK is missing $file." }
          }
          "VULKAN_SDK=$sdkRoot" >> $env:GITHUB_ENV
          (Join-Path $sdkRoot 'Bin') >> $env:GITHUB_PATH
      - uses: actions/cache@v4
        id: native-cache
        with:
          path: |
            Vendor/llama
            Vendor/sqlite
            Vendor/stb
            Vendor/miniz
            Vendor/pdfium
            Vendor/VENDOR
          key: windows-${{ matrix.backend }}-swift6.2.3-b11461-${{ matrix.backend == 'vulkan' && format('sdk{0}-', env.VULKAN_SDK_VERSION) || '' }}${{ hashFiles('scripts/build-llama.sh', 'scripts/llama.cpp-no-logits.patch', 'scripts/fetch-vendor.sh') }}
      - uses: FedericoCarboni/setup-ffmpeg@36c6454b5a2348e7794ba2d82a21506605921e3d
        with:
          ffmpeg-version: release
          linking-type: static
      - run: ./scripts/build-windows.ps1 -GpuBackends ${{ matrix.backend }} -SkipApp -Test
      - uses: actions/cache/save@v4
        if: always() && hashFiles('Vendor/llama/BUILD') != '' && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            Vendor/llama
            Vendor/sqlite
            Vendor/stb
            Vendor/miniz
            Vendor/pdfium
            Vendor/VENDOR
          key: windows-${{ matrix.backend }}-swift6.2.3-b11461-${{ matrix.backend == 'vulkan' && format('sdk{0}-', env.VULKAN_SDK_VERSION) || '' }}${{ hashFiles('scripts/build-llama.sh', 'scripts/llama.cpp-no-logits.patch', 'scripts/fetch-vendor.sh') }}
      - uses: actions/upload-artifact@v4
        with:
          name: DigUp-Windows-helper-${{ matrix.backend }}
          path: windows/artifacts/WinDigUp
  openvino:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openvino==2026.4.1 numpy==2.5.4 pytest
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install transformers==5.19.0
      - run: python -m pytest -q worker/windows/test_openvino_worker.py
  package:
    name: package (${{ matrix.backend }})
    needs: [winui, helper, openvino]
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cpu
            artifact: WinDigUp-Windows-x64
          - backend: vulkan
            artifact: WinDigUp-Windows-x64-AMD-Vulkan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WinUI-build
          path: package/WinDigUp
      - uses: actions/download-artifact@v4
        with:
          name: DigUp-Windows-helper-${{ matrix.backend }}
          path: package/WinDigUp
      - name: Verify packaged helper and backend without the development toolchain
        shell: pwsh
        run: |
          ./scripts/verify-windows-package.ps1 -PackageDirectory ./package/WinDigUp -Backend ${{ matrix.backend }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package/WinDigUp
