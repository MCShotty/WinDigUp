name: Repackage and verify installer registration
on:
  push:
    branches: [codex/installer-recheck]
permissions:
  contents: read
  actions: read
jobs:
  installed:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify unchanged compiled sources
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin 6fc826c43c0a65f69cd906049aea735bd8ef91dd
          if($LASTEXITCODE){throw 'Missing runtime source'}
          git diff --exit-code 6fc826c43c0a65f69cd906049aea735bd8ef91dd HEAD -- . ':!.github/workflows/launcher-contracts.yml' ':!.github/workflows/installer-recheck.yml' ':!scripts/check-windows-copilot.ps1' ':!shell/src-tauri/windows/register-copilot.ps1'
          if($LASTEXITCODE){throw 'Compiled sources differ; a full rebuild is required'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 12713350599
          run-id: 40454742713
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/installer-candidate
      - name: Extract verified binaries and repackage with corrected registration
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'installer-candidate'
          $cert=@(Get-ChildItem $root -Recurse -Filter TEST-ONLY-WinDigUp.cer)
          $setup=@(Get-ChildItem $root -Recurse -Filter '*-setup.exe')
          if($cert.Count -ne 1 -or $setup.Count -ne 1){throw 'Unexpected artifact layout'}
          scripts/check-windows-copilot.ps1 -PrepareTrust -CertificatePath $cert[0].FullName
          if($LASTEXITCODE){throw 'Certificate preparation failed'}
          $process=Start-Process $setup[0].FullName -ArgumentList '/S' -PassThru -Wait
          if($process.ExitCode){throw 'Runtime extraction failed'}
          $installed=Join-Path $env:LOCALAPPDATA 'DigUp'
          $release=Join-Path $PWD 'shell/src-tauri/target/release'
          New-Item -ItemType Directory -Force $release | Out-Null
          Copy-Item (Join-Path $installed 'DigUp.exe') (Join-Path $release 'digup-shell.exe')
          Copy-Item (Join-Path $installed 'DigUp.exe') (Join-Path $release 'DigUp.exe')
          Copy-Item (Join-Path $installed 'helper/digup-discovery.exe') (Join-Path $release 'digup-discovery.exe')
          Copy-Item (Join-Path $installed 'helper') shell/src-tauri/helper -Recurse
          Copy-Item (Join-Path $installed 'copilot') shell/src-tauri/copilot -Recurse
          Copy-Item (Join-Path $installed 'THIRD-PARTY-NOTICES.txt') shell/src-tauri/THIRD-PARTY-NOTICES.txt
          Copy-Item shell/src-tauri/windows/register-copilot.ps1 shell/src-tauri/copilot/register.ps1 -Force
          Remove-Item shell/src-tauri/copilot/registration.json -ErrorAction SilentlyContinue
          $config=Join-Path $env:RUNNER_TEMP 'repackage.json'
          @{bundle=@{resources=@{'helper/'='helper/';'copilot/'='copilot/';'THIRD-PARTY-NOTICES.txt'='THIRD-PARTY-NOTICES.txt'}}}|ConvertTo-Json -Depth 8|Set-Content -Encoding UTF8 $config
          Push-Location shell/src-tauri
          try {
            bash ../../../scripts/tauri-cli.sh bundle --bundles nsis --config $config
            if($LASTEXITCODE){throw 'Native installer repackaging failed'}
          } finally {Pop-Location}
      - name: Verify actual post-install registration and activation
        shell: pwsh
        run: |
          $setup=@(Get-ChildItem shell/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if($setup.Count -ne 1){throw 'Missing corrected installer'}
          $process=Start-Process $setup[0].FullName -ArgumentList '/S' -PassThru -Wait
          if($process.ExitCode){throw 'Corrected installation failed'}
          scripts/check-windows-copilot.ps1
          if($LASTEXITCODE){throw 'Corrected post-install registration failed'}
          scripts/check-windows-settings.ps1
          if($LASTEXITCODE){throw 'Installed Settings activation regressed'}
          Write-Output 'PASS: real corrected NSIS installer registers the signed provider and supports cold/warm activation. Compiled sources match PR.'
          Write-Output 'UNVALIDATED: physical Windows 11 key/picker and accelerators.'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: DigUp-windows-x64-verified
          path: |
            shell/src-tauri/target/release/bundle/nsis/*-setup.exe
            shell/src-tauri/copilot/TEST-ONLY-WinDigUp.cer
