name: Final installed payload and removal
on:
  push:
    branches: [codex/installer-recheck]
permissions:
  contents: read
  actions: read
jobs:
  installed:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 12713184605
          run-id: 40458998738
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/installer-candidate
      - name: Verify original NSIS marker and actual uninstall hooks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'installer-candidate'
          $cert=@(Get-ChildItem $root -Recurse -Filter TEST-ONLY-WinDigUp.cer)
          $setup=@(Get-ChildItem $root -Recurse -Filter '*-setup.exe')
          if($cert.Count -ne 1 -or $setup.Count -ne 1){throw 'Unexpected artifact layout'}
          scripts/check-windows-copilot.ps1 -PrepareTrust -CertificatePath $cert[0].FullName
          if($LASTEXITCODE){throw 'CI certificate preparation failed'}
          $process=Start-Process $setup[0].FullName -ArgumentList '/S' -PassThru -Wait
          if($process.ExitCode){throw 'Installation failed'}
          $installed=Join-Path $env:LOCALAPPDATA 'DigUp'
          $exe=Join-Path $installed 'DigUp.exe'
          $binary=[IO.File]::ReadAllBytes($exe)
          $text=[Text.Encoding]::ASCII.GetString($binary)
          if(!$text.Contains('__TAURI_BUNDLE_TYPE_VAR_NSS') -or $text.Contains('__TAURI_BUNDLE_TYPE_VAR_UNK')){throw 'The installed binary does not retain its initialized NSIS updater marker'}
          $hash=[Security.Cryptography.SHA256]::Create()
          try{$digest=[BitConverter]::ToString($hash.ComputeHash($binary)).Replace('-','')}finally{$hash.Dispose()}
          Write-Output ('PASS: original NSIS updater marker is initialized; installed main SHA256='+$digest)
          if(!(Get-AppxPackage -Name 'MCShotty.WinDigUp.Launcher')){throw 'Actual installer did not register the provider'}
          $sentinel=Join-Path $installed 'index/installer-retention-fixture.txt'
          New-Item -ItemType Directory -Force (Split-Path $sentinel) | Out-Null
          Set-Content -Encoding UTF8 $sentinel 'Preserve existing user index data'
          $uninstaller=Join-Path $installed 'uninstall.exe'
          if(!(Test-Path $uninstaller)){throw 'Native uninstaller absent'}
          $process=Start-Process $uninstaller -ArgumentList '/S' -PassThru -Wait
          if($process.ExitCode){throw 'Native uninstallation failed'}
          $deadline=[DateTime]::UtcNow.AddSeconds(30)
          do {
            $registered=Get-AppxPackage -Name 'MCShotty.WinDigUp.Launcher'
            if(!$registered){break}
            Start-Sleep -Milliseconds 250
          }while([DateTime]::UtcNow -lt $deadline)
          if($registered){throw 'Native uninstall retained the Copilot-key identity'}
          if(!(Test-Path $sentinel)){throw 'Default native uninstall removed retained index data'}
          Write-Output 'PASS: actual NSIS uninstall unregisters this provider and preserves index data by default'
