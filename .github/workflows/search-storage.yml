name: Search storage and availability
on:
  pull_request:
    paths:
      - 'Sources/digup/SearchService.swift'
      - 'Sources/DigUpKit/Searcher.swift'
      - 'Tests/DigUpKitTests/SearchReadersTests.swift'
      - 'Sources/digup/FileAvailability.swift'
      - 'Sources/digup/SearchRetirement.swift'
      - 'Tests/DigUpServiceTests/SearchAvailabilityTests.swift'
      - 'Tests/DigUpServiceTests/SearchNameRefreshTests.swift'
      - 'Tests/DigUpServiceTests/SearchServiceFixture.swift'
      - 'scripts/benchmark-search-scale.py'
      - '.github/workflows/search-storage.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: search-storage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  availability:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select Swift toolchain
        run: |
          selected=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort | tail -1)
          test -n "$selected"
          echo "DEVELOPER_DIR=$selected/Contents/Developer" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            Vendor/llama
            Vendor/llama.cpp
            Vendor/llama-build
          key: concurrency-macos-native-v1-${{ hashFiles('scripts/build-llama.sh', 'scripts/llama.cpp-*.patch') }}
      - name: Build native dependency
        run: bash scripts/build-llama.sh
      - name: Delayed availability evidence without model inference
        run: swift test --filter 'SearchAvailabilityTests|SearchNameRefreshTests'
      - name: Optimized availability and search contracts
        run: swift test -c release --filter 'SearchAvailabilityTests|SearchNameRefreshTests|SearchReadersTests|MixedSearchRankingTests'

  scale:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg xz-utils unzip python3 build-essential cmake ninja-build pkg-config libcurl4-openssl-dev libxml2-dev libedit2 libsqlite3-0 libz3-dev libpython3-dev tzdata libvulkan-dev glslc
      - name: Verified Swift toolchain
        run: |
          version=6.4.0
          url=https://download.swift.org/swift-$version-release/ubuntu2404/swift-$version-RELEASE/swift-$version-RELEASE-ubuntu24.04.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/swift.tar.gz" "$url"
          curl -fsSL -o "$RUNNER_TEMP/swift.tar.gz.sig" "$url.sig"
          curl -fsSL --compressed https://www.swift.org/keys/all-keys.asc | gpg --quiet --import
          gpg --verify "$RUNNER_TEMP/swift.tar.gz.sig" "$RUNNER_TEMP/swift.tar.gz"
          mkdir -p "$RUNNER_TEMP/swift"
          tar -xzf "$RUNNER_TEMP/swift.tar.gz" -C "$RUNNER_TEMP/swift" --strip-components 1
          echo "$RUNNER_TEMP/swift/usr/bin" >> "$GITHUB_PATH"
      - name: Pinned Vulkan shader toolchain
        run: |
          version=1.4.363.0
          curl -fsSL -o "$RUNNER_TEMP/vulkansdk.tar.xz" "https://sdk.lunarg.com/sdk/download/$version/linux/vulkansdk-linux-x86_64-$version.tar.xz"
          echo "197962f5cbf80baf2775a03336a01cee7c8745686c65aaa70d3f751ade4d7e43  $RUNNER_TEMP/vulkansdk.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/vulkansdk.tar.xz" -C "$RUNNER_TEMP"
          sdk=$RUNNER_TEMP/$version/x86_64
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$sdk:$sdk/lib/VulkanLoader" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            Vendor/llama
            Vendor/llama.cpp
            Vendor/llama-build
            Vendor/sqlite
            Vendor/stb
            Vendor/miniz
            Vendor/pdfium
            Vendor/VENDOR
          key: search-storage-linux-v1-${{ hashFiles('scripts/build-llama.sh', 'scripts/llama.cpp-*.patch', 'scripts/fetch-vendor.sh') }}
      - name: Build the real release helper
        run: |
          bash scripts/fetch-vendor.sh
          bash scripts/build-llama.sh
          swift build -c release --product digup
      - name: Measure 100k, 250k and one million synthetic vectors
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/Vendor/llama/lib:$PWD/Vendor/pdfium/lib:${LD_LIBRARY_PATH:-}"
          for run in 1 2; do
            python3 scripts/benchmark-search-scale.py --helper .build/release/digup --vectors 100000 250000 1000000 --samples 100 100 100 --output "search-scale-$run.json" | tee "search-scale-$run.log"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: search-storage-measurements
          path: |
            search-scale-*.json
            search-scale-*.log
          if-no-files-found: ignore
