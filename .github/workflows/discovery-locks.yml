name: Discovery dependency locks
on:
  pull_request:
    paths:
      - 'shell/src-tauri/Cargo.toml'
      - 'tests/applications/native/Cargo.toml'
      - '.github/workflows/discovery-locks.yml'
permissions:
  contents: read
jobs:
  locks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Resolve additional metadata dependencies while preserving existing versions
        run: |
          cargo fetch --locked --manifest-path shell/src-tauri/Cargo.toml
          cargo fetch --manifest-path tests/applications/native/Cargo.toml
      - name: Require the committed lockfiles to match dependency resolution
        run: git diff --exit-code -- shell/src-tauri/Cargo.lock tests/applications/native/Cargo.lock
