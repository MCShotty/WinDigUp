[package]
name = "digup-application-fixtures"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"

[[bin]]
name = "application-provider-check"
path = "provider-check.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
unicode-casefold = "0.2"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }


# Structured, bounded app metadata; no executable code is loaded from descriptions.
yaml-rust2 = { version = "=0.13.0", default-features = false }
url = "=2.5.8"
rustls = { version = "=0.23.46", default-features = false, features = ["ring","std","tls12"] }
dom_query = "=0.28.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking","rustls-no-provider","system-proxy"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Storage_FileSystem", "Win32_System_Variant"] }
image = { version = "0.25", default-features = false, features = ["png"] }
